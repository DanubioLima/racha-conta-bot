# Stack do Slice em produção (Dokploy): `docker compose --profile prod up -d`.
# Sem portas expostas no host — o Traefik do Dokploy roteia o bot publicamente
# via subdomínio (bot.appslice.com.br).
#
# O WhatsApp é via Twilio (API oficial). A stack Evolution/Postgres/Redis do
# provider antigo (Baileys) foi removida após o cutover da Fase B (2026-06-03);
# o número saiu do WhatsApp consumer, então não há rollback pra ela.
#
# Dev local: NÃO precisa de compose. Rode `npm run dev` (hot reload via tsx) e
# exponha o webhook com um túnel (ver README → "Rodar localmente").

services:
  bot:
    profiles: ["prod"]
    build: .
    container_name: slice_bot
    restart: unless-stopped
    networks:
      - slice
    expose:
      - "3000"
    volumes:
      - slice_bot_data:/app/data
    environment:
      PORT: 3000
      USER_WHATSAPP_NUMBER: ${USER_WHATSAPP_NUMBER}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PIX_KEY: ${PIX_KEY}
      PIX_MERCHANT_NAME: ${PIX_MERCHANT_NAME}
      PIX_MERCHANT_CITY: ${PIX_MERCHANT_CITY}

volumes:
  slice_bot_data:

networks:
  slice:
    name: slice
