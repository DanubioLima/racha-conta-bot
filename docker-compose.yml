# Stack do Slice — funciona em dev local E em produção via Dokploy.
#
# Dev local: `docker compose up -d`
#   → sobe Evolution+Postgres+Redis. Bot fica out (profile `prod` não ativado),
#     você roda o bot via `npm run dev` na host pra ter hot reload via tsx.
#   → docker-compose.override.yml expõe a porta 8080 do Evolution localmente
#     pra você curl-ar nos endpoints de pareamento.
#
# Produção (Dokploy): `docker compose --profile prod up -d`
#   → sobe tudo, incluindo o bot. Sem portas expostas no host (Traefik do
#     Dokploy roteia o bot publicamente via subdomínio).
#
# Pareamento do WhatsApp continua via curl, ver runbook.

services:
  postgres:
    image: postgres:15-alpine
    container_name: slice_postgres
    restart: unless-stopped
    networks:
      - slice
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: slice_redis
    restart: unless-stopped
    networks:
      - slice
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: slice_evolution
    restart: unless-stopped
    networks:
      - slice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances
    # Linux: lets containers reach services on the host (the bot at host:3000
    # quando rodando local sem o profile prod). Em produção o bot está na
    # mesma rede Docker e o webhook aponta pra http://bot:3000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-local-dev}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:-evolution}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "true"
      TELEMETRY: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"

  bot:
    profiles: ["prod"]
    build: .
    container_name: slice_bot
    restart: unless-stopped
    networks:
      - slice
    depends_on:
      evolution-api:
        condition: service_started
    expose:
      - "3000"
    volumes:
      - slice_bot_data:/app/data
    environment:
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-change-me-local-dev}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-slice}
      USER_WHATSAPP_NUMBER: ${USER_WHATSAPP_NUMBER}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PIX_KEY: ${PIX_KEY}
      PIX_MERCHANT_NAME: ${PIX_MERCHANT_NAME}
      PIX_MERCHANT_CITY: ${PIX_MERCHANT_CITY}
      LEDGER_SOURCE: ${LEDGER_SOURCE:-cumbuca}

volumes:
  evolution_postgres:
  evolution_redis:
  evolution_instances:
  slice_bot_data:

networks:
  slice:
    name: slice
