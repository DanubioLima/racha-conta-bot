# Local-only stack for the Evolution API.
# This stack is for development on the same machine as the bot.
# Do NOT use these credentials/keys in production.
#
# After `docker compose up -d`:
#   - Evolution API:     http://localhost:8080
#   - Postgres:          localhost:5432 (evolution / evolution)
#   - Redis:             localhost:6379
#
# Pairing the WhatsApp number is done via curl (see README).

services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    networks:
      - racha-conta
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    networks:
      - racha-conta
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    networks:
      - racha-conta
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    # Linux: lets containers reach services on the host (the bot at host:3000).
    # On Docker Desktop (Mac/Windows) this hostname already works.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Server
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # Auth (used as `apikey` header — keep in sync with EVOLUTION_API_KEY in .env)
      AUTHENTICATION_API_KEY: change-me-local-dev

      # Database
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # Cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # QR / Session
      QRCODE_LIMIT: 30
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome

      # Logs
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "true"

      # Don't phone home in local dev
      TELEMETRY: "false"

      # We configure webhooks per-instance after pairing, so leave global off.
      WEBHOOK_GLOBAL_ENABLED: "false"

volumes:
  evolution_postgres:
  evolution_redis:
  evolution_instances:

networks:
  racha-conta:
    name: racha-conta
